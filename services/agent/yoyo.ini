; yoyo-migrations config for the SparkPoint agent-service data layer.
; Raw-SQL migrations live in ./migrations (see migrations/0001_foundation.sql).
;
; The database DSN is intentionally NOT stored here — pass it at apply time from
; the environment so credentials never live in the repo:
;
;   export $(grep -v '^#' ../../.env | xargs)      # loads DATABASE_URL
;   .venv/bin/yoyo apply   --database "$DATABASE_URL" --config yoyo.ini
;   .venv/bin/yoyo rollback --database "$DATABASE_URL" --config yoyo.ini
;   .venv/bin/yoyo list    --database "$DATABASE_URL" --config yoyo.ini
;
; yoyo's default postgresql:// backend uses psycopg2 (dependency-group
; `migrations`). This tool is run out-of-band; it is NOT imported by the service.
[DEFAULT]
sources = %(here)s/migrations
migration_table = _yoyo_migration
batch_mode = on
verbosity = 2
