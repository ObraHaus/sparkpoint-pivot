# Sparky golden eval set — spec 058.
#
# Every case is a real user message (the 26 beta-audit prompts plus NEAR/swap/knowledge/
# adversarial/edge coverage). `expected` is the CURRENT intended behaviour after 057.
# `offline` supplies the canned LLM answer for the deterministic run; deterministic routes
# fire before it, so a mis-route still fails loudly. An optional `crosschain` key
# (`quote` | `transport_error` | `disabled`) wires the 068 fixture; without it the DAG is
# byte-for-byte the pre-068 path.
version: 1
cases:
  # ── The 26 beta-audit prompts ───────────────────────────────────────────────
  - id: audit-01-identity
    category: identity
    prompt: "What is Sparky and what can you do for me?"
    wallet: empty
    expected:
      route: general
      blocks_present: [text]
      blocks_absent: [action, recommendation, portfolio_snapshot]
      must_contain: ["sparky"]
      must_not_contain: ["guardrails"]
    offline:
      intent: {kind: other}
    offline_check_contains: false

  - id: audit-02-portfolio
    category: portfolio
    prompt: "What is my portfolio worth right now?"
    wallet: with_position
    expected:
      route: portfolio
      blocks_present: [portfolio_snapshot, text]
      blocks_absent: [action, recommendation]
      must_contain: ["you're holding", "5250.00"]
    offline:
      intent: {kind: portfolio}

  - id: audit-03-vault-apy
    category: apy
    prompt: "What is the current APY of the SparkPoint vault?"
    wallet: empty
    expected:
      route: curated
      blocks_present: [text]
      blocks_absent: [action, recommendation]
      must_contain: ["gauntlet usdc prime", "4.41%", "as of 2026-09-18"]
    offline:
      intent: {kind: build_action, actionType: aerodrome_swap, asset: USDC, amount: 100000000}

  - id: audit-04-best-vault
    category: curated
    prompt: "Which vault should I put 1,000 USDC in for low risk?"
    wallet: empty
    expected:
      route: curated
      blocks_present: [text]
      blocks_absent: [action, recommendation]
      must_contain: ["gauntlet usdc prime", "4.41%", "as of 2026-09-18"]
    offline:
      intent: {kind: build_action, actionType: aerodrome_swap, asset: USDC, amount: 100000000}

  - id: audit-05-deposit-500
    category: deposit
    prompt: "Deposit 500 USDC into the safest vault"
    wallet: with_position
    expected:
      route: "proposal:vault_deposit"
      blocks_present: [action]
      blocks_absent: [recommendation]
      action: {type: vault_deposit, amount: "500000000", policy: approved}
    offline:
      intent: {kind: build_action, actionType: vault_deposit, asset: USDC, amount: 500000000}

  - id: audit-06-withdraw-all
    category: withdraw
    prompt: "Withdraw everything from my vault"
    wallet: with_position
    expected:
      route: "proposal:vault_withdraw"
      blocks_present: [action]
      blocks_absent: [recommendation]
      action: {type: vault_withdraw, amount: "250000000", policy: approved}
    offline:
      intent: {kind: other}

  - id: audit-07-eth-price
    category: price
    prompt: "What is the price of ETH today?"
    wallet: empty
    expected:
      route: general
      blocks_present: [text]
      blocks_absent: [action, recommendation]
      # 060: a live reference figure is now the intended answer, with its source + as-of stamp.
      # The offline fixtures have no price feed, so the honest "unavailable" copy is also valid.
      must_contain:
        - 're:(?:as of \d{2}:\d{2} UTC.*source:)|(?:couldn''t fetch a live price)'
      rubric: [accuracy, grounding, safety, tone]
    offline:
      intent: {kind: other}
    offline_check_contains: false

  - id: audit-08-morpho-vs-aave
    category: knowledge
    prompt: "Is Morpho safer than Aave? Explain simply."
    wallet: empty
    expected:
      routes: [knowledge, general]
      blocks_absent: [action, recommendation]
      must_contain: ["morpho", "aave"]
    offline:
      intent: {kind: learn, topic: morpho_vs_aave}
    offline_check_contains: false

