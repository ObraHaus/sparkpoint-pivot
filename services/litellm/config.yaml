# LiteLLM proxy config — SparkPoint develop gateway (Phase A).
#
# Maps the stable alias `sparkpoint-chat` to OpenRouter models. ONLY this gateway ever holds
# the OpenRouter key; Hermes calls the gateway with a LiteLLM virtual key. Secrets resolve from
# the process env via `os.environ/…` and are NEVER written into this file.
#
# RELIABILITY: OpenRouter's `:free` tier is aggressively rate-limited per upstream provider, so
# every alias is a GROUP: a primary plus a verified-available fallback; the router retries the
# other deployment on a 429 and cools the throttled one down. Swap either to a paid model / BYOK
# key for hard reliability. (Lineup switched 2026-10-04 — Ling 3.0 Sante + Qwen 3.8 free primary,
# Ling 3.1 Flash + Apodex 1.1 Mini premium; all four were probed live before the switch.)
#
# The DATABASE_URL env (a dedicated, isolated Postgres — never the agent's DB) is auto-detected
# by LiteLLM for virtual keys + per-user budgets.

model_list:
  - model_name: sparkpoint-chat
    litellm_params:
      # primary (operator-selected 2026-10-04): Ling 3.0 Flash Sante (free) — probed live with clean
      # JSON intent output at ~$0. weight biases simple-shuffle 4:1 toward this deployment; the Qwen
      # 3.8 27B fallback absorbs cooldowns.
      model: openrouter/inclusionai/ling-3.0-flash-sante:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      weight: 4
  - model_name: sparkpoint-chat
    litellm_params:
      # verified-available free fallback (probed live) so the alias serves when the primary 429s.
      model: openrouter/qwen/qwen3.8-27b:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      weight: 1

  # Premium alias (feature 008, US4) — the premium-tier alias, a clear step up from the free open
  # models. Mirrors the free alias's primary+fallback shape: Ling 3.1 Flash is the primary (weight 4;
  # 262k ctx — sharp reasoning + clean JSON); Apodex 1.1 Mini is the same-tier secondary (weight 1)
  # that absorbs cooldowns when the primary 429s. If the WHOLE premium group fails the router FALLS
  # BACK to the free `sparkpoint-chat` alias (router_settings.fallbacks) so premium degrades to free
  # quality instead of erroring. Both upstreams are currently $0 (2026-10-04) — costs are pinned to
  # 0 so LiteLLM's spend accounting matches reality; keep in sync if upstream pricing moves.
  - model_name: sparkpoint-chat-premium
    litellm_params:
      model: openrouter/inclusionai/ling-3.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      weight: 4
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      # Per-deployment request/min ceiling used by the router for load-based routing (primary carries
      # the bulk of premium traffic). The virtual key's global rpm is the real spend/abuse ceiling.
      rpm: 60
  - model_name: sparkpoint-chat-premium
    litellm_params:
      model: openrouter/apodex/apodex-1.1-mini:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      weight: 1
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      # Fallback deployment — a smaller per-min ceiling (it only absorbs the primary's cooldowns).
      rpm: 30

  # Self-authoring alias (034) — Sparky's daily self-authored research job. SAME models as
  # sparkpoint-chat-premium, but its OWN model_name so the gateway's Activity view can separate the
  # job's traffic from users' chat traffic (the job must not compete with a user's pool). Added to
  # this config on 2026-10-04 so it exists on BOTH gateways: it previously lived only in the alpha
  # gateway's DB (added via the admin console), so beta self-authoring runs had no model at all.
  # DELIBERATELY NO router fallback to the chat aliases — a failed run writes nothing and leaves the
  # published documents untouched, which is the safe outcome; degrading onto users' pool is not.
  - model_name: sparkpoint-selfauthor
    litellm_params:
      model: openrouter/inclusionai/ling-3.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      weight: 4
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      rpm: 60
  - model_name: sparkpoint-selfauthor
    litellm_params:
      model: openrouter/apodex/apodex-1.1-mini:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      weight: 1
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      rpm: 30

litellm_settings:
  drop_params: true          # tolerate provider-specific param differences
  set_verbose: false         # never verbose-log request bodies (could carry prompt content)
  request_timeout: 120
  num_retries: 3             # retry across the group on a transient upstream failure

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  allowed_fails: 1
  cooldown_time: 30          # park a 429'd deployment for 30s, serve from the other
  # Premium degrades to the free alias on ANY failure of the paid model (e.g. out of credit) — so
  # a premium user never gets an error just because the paid model is unavailable.
  fallbacks: [{"sparkpoint-chat-premium": ["sparkpoint-chat"]}]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # admin/root key; server-side only, never shipped to a client
  # Per-user budgets/limits keyed by the LiteLLM `user` field (the server-verified wallet, Phase B).
