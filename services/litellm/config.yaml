# LiteLLM proxy config — SparkPoint develop gateway (Phase A).
#
# Maps the stable alias `sparkpoint-chat` to an OpenRouter model. ONLY this gateway ever
# holds the OpenRouter key; Hermes calls the gateway with a LiteLLM virtual key. Secrets are
# resolved from the process env via `os.environ/…` and are NEVER written into this file.
#
# The DATABASE_URL env (when set) is auto-detected by LiteLLM for its own key/spend tables in
# an ISOLATED `litellm` database (never the agent's DB). Without it, the gateway still proxies
# and enforces the master key + per-model rpm/tpm, but dynamic virtual keys / per-user budgets
# require the DB.

model_list:
  - model_name: sparkpoint-chat
    litellm_params:
      # mirrors OPENROUTER_MODEL (google/gemma-4-31b-it:free) — model id is not a secret.
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      # Coarse gateway-side ceilings (the client-side fail-closed resilience layer stays in Hermes).
      rpm: 60
      tpm: 120000

litellm_settings:
  drop_params: true          # tolerate provider-specific param differences
  set_verbose: false         # never verbose-log request bodies (could carry prompt content)
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # admin/root key; server-side only, never shipped to a client
  # Per-user budgets/limits keyed by the LiteLLM `user` field (the server-verified wallet, Phase B).
  # (Enforcement requires the DB; see DATABASE_URL note above.)
