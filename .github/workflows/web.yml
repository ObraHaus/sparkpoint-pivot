name: web
on:
  push:
    branches: [develop, main]
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]

# GITHUB_TOKEN is read-only. Cache restore/save uses the separate cache token
# (trigger default: write on push and same-repo PRs, read on fork PRs) and does
# not need actions: write. No job comments, publishes checks, or uses OIDC.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # Self-hosted runners we operate (label oh-ci) only for pushes and for
    # pull requests opened from this repository. Fork PRs skip this job
    # (the check still reports skipped) and run on web-fork-pr instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, oh-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ensure next-env.d.ts (Next auto-generates it; gitignored, absent on fresh checkout)
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > apps/web/next-env.d.ts
      - name: typecheck
        run: pnpm --filter @sparkpoint/web exec tsc --noEmit
      - name: typecheck tests
        run: pnpm --filter @sparkpoint/web typecheck:test
      - name: unit tests (node:test)
        run: pnpm --filter @sparkpoint/web test
      - name: lint
        run: pnpm --filter @sparkpoint/web lint

  # Fork PRs only. GitHub-hosted, no secrets, contents: read. Same typecheck,
  # tests, and lint as `web`. Same-repo PRs skip this so CI is not doubled.
  web-fork-pr:
    name: web (fork PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ensure next-env.d.ts (Next auto-generates it; gitignored, absent on fresh checkout)
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > apps/web/next-env.d.ts
      - name: typecheck
        run: pnpm --filter @sparkpoint/web exec tsc --noEmit
      - name: typecheck tests
        run: pnpm --filter @sparkpoint/web typecheck:test
      - name: unit tests (node:test)
        run: pnpm --filter @sparkpoint/web test
      - name: lint
        run: pnpm --filter @sparkpoint/web lint
