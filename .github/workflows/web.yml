name: web
on:
  push:
    branches: [develop]
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
  pull_request:
    branches: [develop]
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, oh-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ensure next-env.d.ts (Next auto-generates it; gitignored, absent on fresh checkout)
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > apps/web/next-env.d.ts
      - name: typecheck
        run: pnpm --filter @sparkpoint/web exec tsc --noEmit
      - name: typecheck tests
        run: pnpm --filter @sparkpoint/web typecheck:test
      - name: unit tests (node:test)
        run: pnpm --filter @sparkpoint/web test
      - name: lint
        run: pnpm --filter @sparkpoint/web lint
