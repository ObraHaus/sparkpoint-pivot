name: agent
on:
  push:
    branches: [develop, "feature/**"]
    paths: ["services/agent/**", ".github/workflows/agent.yml"]
  pull_request:
    branches: [develop]
    paths: ["services/agent/**", ".github/workflows/agent.yml"]
jobs:
  agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: venv + deps (uv-managed; system python is externally-managed)
        run: |
          uv venv --python 3.12
          uv pip install fastapi "uvicorn[standard]" pydantic httpx anthropic ruff mypy pytest pytest-asyncio
      - name: ruff
        run: .venv/bin/ruff check src
      - name: mypy
        run: .venv/bin/mypy src/sparkpoint_agent || echo "mypy findings (non-blocking until W3)"
      - name: pytest
        run: .venv/bin/pytest -q || { rc=$?; [ "$rc" -eq 5 ] && echo "no tests yet — green-by-skip" || exit $rc; }
