name: contracts
on:
  push:
    branches: [develop, main]
    # ITEM 6 — a policy-constant change (packages/shared/src/policy/**) must re-run the
    # N1-N5 non-custody invariants: the shared caps/slippage/fee are the source of truth the
    # on-chain policy is asserted equal to, so a drift there has to re-gate the invariants.
    paths: ["contracts/**", "packages/shared/src/policy/**", ".github/workflows/contracts.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["contracts/**", "packages/shared/src/policy/**", ".github/workflows/contracts.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, oh-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { submodules: recursive }
      - id: guard
        name: green-by-skip until contracts exist
        run: |
          if ls contracts/src/*.sol >/dev/null 2>&1; then echo "run=true" >> "$GITHUB_OUTPUT";
          else echo "no .sol yet — green-by-skip"; echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        if: steps.guard.outputs.run == 'true'
        with: { version: stable }
      - name: build + test + fuzz
        if: steps.guard.outputs.run == 'true'
        working-directory: contracts
        run: |
          forge build
          forge test -vvv
      - name: exported ABIs up-to-date (T015 — no drift vs build)
        if: steps.guard.outputs.run == 'true'
        run: |
          # Re-run the export pipeline against the fresh build; the checked-in
          # ABIs (packages/shared/src/abis) must byte-match, or a contract changed
          # without re-exporting. Deterministic (jq -S), so this is a clean gate.
          bash contracts/script/export-abis.sh
          if ! git diff --exit-code -- packages/shared/src/abis; then
            echo "::error::exported ABIs are stale — run \`bash contracts/script/export-abis.sh\` and commit"; exit 1
          fi
      - name: N1-N5 non-custody invariant suite (REQUIRED — gating)
        if: steps.guard.outputs.run == 'true'
        working-directory: contracts
        run: |
          if ls test/invariant/*.t.sol >/dev/null 2>&1; then
            forge test --match-path "test/invariant/*" -vvv
          else
            echo "invariant suite not written yet — green-by-skip (must exist + pass by W5b)"
          fi
      - name: slither (advisory)
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: pipx run slither-analyzer contracts || true
