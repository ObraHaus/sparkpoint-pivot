name: OH Defender
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Scanners to run: "all" or a comma list of trivy,semgrep,gitleaks,slither,aderyn,solhint.'
        required: false
        default: 'all'
      trigger:
        description: 'How the scan was triggered (manual | scheduled).'
        required: false
        default: 'manual'
# GITHUB_TOKEN stays read-only. This job does not push, comment, or open a
# check run; "Scan & review" is the job result itself. The scan reports through
# the Defender API. Do not grant a write scope here without proof the action
# calls the GitHub API.
permissions:
  contents: read
jobs:
  security:
    # Required status check: workflow name "OH Defender", job name "Scan & review".
    # Do not rename either. Self-hosted (label oh-defender) only for
    # workflow_dispatch and for pull requests opened from this repository.
    # Fork PRs skip this job, so the check still reports skipped, and fork
    # code never runs on a runner we operate. There is no GitHub-hosted
    # stand-in: the scan needs DEFENDER_API_URL and DEFENDER_API_KEY.
    name: Scan & review
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, oh-defender]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Foundry vendors its dependencies as git submodules, so without this the
          # tree that reaches the worker has empty lib/ directories and cannot
          # compile — the smart-contract lane's AST analyzers would fail on every
          # Solidity repo (spec 007 FR-011). Checking out the pinned submodule
          # commits keeps the analyzed tree the tree under review, which running
          # `forge install` at scan time would not: that re-resolves from the
          # network and can pick up something the PR never pinned.
          submodules: recursive
          persist-credentials: false
      - uses: ObraHaus/obrahaus-defender/ci/scan-action@2b46e3dcc1608af186dcbf167b2ac5d59eb5b0cd # develop: PR #122 AI-review timeout/progress repair
        with:
          defender-api-url: ${{ secrets.DEFENDER_API_URL }}
          defender-api-key: ${{ secrets.DEFENDER_API_KEY }}
          tools: ${{ github.event.inputs.tools || 'all' }}
          trigger: ${{ github.event_name == 'pull_request' && 'pull_request' || (github.event.inputs.trigger || 'manual') }}
          default-branch: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
