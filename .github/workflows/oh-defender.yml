name: OH Defender
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Scanners to run: "all" or a comma list of trivy,semgrep,gitleaks.'
        required: false
        default: 'all'
      trigger:
        description: 'How the scan was triggered (manual | scheduled).'
        required: false
        default: 'manual'
permissions:
  contents: read
jobs:
  security:
    name: Scan & review
    runs-on: [self-hosted, oh-defender]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ObraHaus/obrahaus-defender/ci/scan-action@6cc83a57532e3492b0a16b13f714df2e37a3a8ad # develop
        with:
          defender-api-url: ${{ secrets.DEFENDER_API_URL }}
          defender-api-key: ${{ secrets.DEFENDER_API_KEY }}
          tools: ${{ github.event.inputs.tools || 'all' }}
          trigger: ${{ github.event_name == 'pull_request' && 'pull_request' || (github.event.inputs.trigger || 'manual') }}
          default-branch: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
