<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SparkPoint Ops — Admin</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html,body{margin:0;height:100%;}
  body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden;}
  .tnum{font-variant-numeric:tabular-nums slashed-zero;}
  .mono{font-family:var(--font-mono);}
  *{box-sizing:border-box;}
  ::-webkit-scrollbar{width:9px;height:9px;}::-webkit-scrollbar-thumb{background:var(--input);border-radius:999px;border:2px solid transparent;background-clip:padding-box;}

  #ad{height:100%;}
  .ad{--barh:56px;display:flex;flex-direction:column;height:100%;overflow:hidden;}
  /* top bar — plain in-flow flex item: NO position/z-index (stacking context) and NO
     sticky/transform. Those promote it to its own compositing layer, which a post-load
     repaint inside the Showcase's clipped/scaled iframes drops after ~1s. */
  /* class renamed .adtop -> .opsbar: the design preview intermittently suppresses
     the literal .adtop class, hiding the bar in-app though it's fine when downloaded. */
  .opsbar{flex:0 0 var(--barh);display:flex;align-items:center;gap:14px;height:var(--barh);box-sizing:border-box;padding:0 18px;border-bottom:1px solid var(--border-soft);background:var(--card);}
  .adbrand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;}
  .adbrand .smk{width:21px;height:21px;}
  .envbadge{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--loss);border:1px solid color-mix(in srgb,var(--loss) 40%,transparent);border-radius:6px;padding:3px 7px;}
  .fresh{font-size:11.5px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;}
  .grow{flex:1;}
  .obschip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--info);
    background:var(--info-subtle);border:1px solid color-mix(in srgb,var(--info) 26%,transparent);border-radius:999px;padding:6px 11px;cursor:help;}
  .roleswitch{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted-foreground);position:relative;}
  /* custom dropdown (replaces native <select>, which mis-renders inside the scaled Showcase iframe) */
  .rolebtn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;}
  .rolebtn:hover{border-color:var(--primary);}
  .rolebtn .cv{width:13px;height:13px;color:var(--muted-foreground);transition:transform .15s;flex:none;}
  .rolebtn[aria-expanded="true"] .cv{transform:rotate(180deg);}
  .rolemenu{position:fixed;min-width:172px;background:var(--popover);border:1px solid var(--border);border-radius:10px;padding:5px;box-shadow:var(--shadow-lg);z-index:130;display:none;}
  .rolemenu.open{display:block;}
  .roleopt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--foreground);cursor:pointer;white-space:nowrap;}
  .roleopt:hover{background:var(--muted);}
  .roleopt.sel{color:var(--primary);font-weight:600;}
  .roleopt .chk{margin-left:auto;width:14px;height:14px;flex:none;opacity:0;}
  .roleopt.sel .chk{opacity:1;}

  .adbody{flex:1 1 auto;display:flex;min-height:0;}
  .adnav{width:200px;flex:none;border-right:1px solid var(--border-soft);padding:12px 9px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;background:var(--card);}
  .adnav .seclbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:12px 10px 5px;}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted-foreground);cursor:pointer;border-left:2px solid transparent;transition:.15s;}
  .navitem:hover{background:var(--muted);color:var(--foreground);}
  .navitem.active{background:var(--spark-subtle);color:var(--foreground);border-left-color:var(--primary);}
  .navitem.active svg{color:var(--primary);}
  .navitem svg{width:17px;height:17px;flex:none;}
  .navitem .star{margin-left:auto;color:var(--primary);font-size:11px;}

  .adcontent{flex:1;overflow-y:auto;padding:24px 28px 60px;}
  .adcontent.max{max-width:1320px;margin:0 auto;width:100%;}
  .pghead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .pghead h1{font-size:23px;font-weight:600;letter-spacing:-.01em;margin:0;}
  .pghead .sub{font-size:13px;color:var(--muted-foreground);margin-top:4px;}
  .ctrls{display:flex;gap:8px;align-items:center;}
  .seg{display:inline-flex;background:var(--muted);border-radius:8px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;color:var(--muted-foreground);font-family:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;}
  .seg button.on{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.3);}
  .btn-exp{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted-foreground);background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;}

  .band{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  @media(max-width:1180px){.band{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 16px;}
  .kpi .k{font-size:11.5px;color:var(--muted-foreground);font-weight:500;display:flex;align-items:center;gap:6px;}
  .kpi .v{font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:6px;line-height:1;}
  .kpi .foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;}
  .delta.up{color:var(--gain);}.delta.down{color:var(--loss);}.delta.flat{color:var(--muted-foreground);}
  .aimark{width:6px;height:6px;border-radius:50%;background:var(--primary);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .grid2 .span2{grid-column:1/-1;}
  @media(max-width:1080px){.grid2{grid-template-columns:1fr;}}
  .chartcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .chartcard .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:10px;}
  .chartcard .ct{font-size:14px;font-weight:600;}
  .chartcard .prov{font-size:10.5px;color:var(--muted-foreground);}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 4px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted-foreground);}
  .legend i{width:11px;height:11px;border-radius:3px;display:block;}
  .legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px);border-radius:0;height:3px;width:14px;}
  .estbadge{font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--primary);background:var(--spark-subtle);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:5px;padding:1px 5px;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .statusrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
  .statusrow:last-child{border-bottom:none;}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 10px;}
  .pill.ok{color:var(--gain);background:var(--gain-subtle);}
  .pill.info{color:var(--info);background:var(--info-subtle);}
  .pill.amber{color:var(--caution);background:var(--caution-subtle);}
  .pill .led{width:7px;height:7px;border-radius:50%;background:currentColor;}

  table.adtbl{width:100%;border-collapse:collapse;}
  table.adtbl th{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-soft);}
  table.adtbl td{padding:10px;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
  table.adtbl tr:last-child td{border-bottom:none;}
  table.adtbl .num{text-align:right;font-variant-numeric:tabular-nums;}
  table.adtbl tfoot td{font-weight:600;border-top:1px solid var(--border);border-bottom:none;}

  .weeornot{background:var(--card);border:1px solid color-mix(in srgb,var(--primary) 24%,transparent);border-radius:12px;padding:16px 18px;}
  .infobanner{display:flex;align-items:flex-start;gap:10px;background:var(--info-subtle);border:1px solid color-mix(in srgb,var(--info) 22%,transparent);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--muted-foreground);line-height:1.5;margin-bottom:16px;}
  .infobanner svg{color:var(--info);flex:none;margin-top:1px;}
  .trustbadges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:1080px){.trustbadges{grid-template-columns:repeat(2,1fr);}}
  .tb{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px;display:flex;gap:10px;align-items:flex-start;}
  .tb svg{color:var(--gain);flex:none;margin-top:1px;}
  .tb .tbt{font-size:12.5px;font-weight:600;}
  .tb .tbs{font-size:11px;color:var(--muted-foreground);margin-top:2px;line-height:1.4;}
  text{font-family:var(--font-mono);}

  /* mobile menu toggle (hidden on desktop) */
  .adburger{display:none;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:8px;border:1px solid var(--border);background:var(--spark-subtle);color:var(--foreground);cursor:pointer;flex:none;font-family:inherit;font-size:12.5px;font-weight:600;}
  .navclose{display:none;}
  .adnav-scrim{display:none;}
  .addialog-scrim{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;opacity:0;transition:opacity .2s;}
  .addialog-scrim.show{opacity:1;}
  .addialog{background:var(--popover);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);}

  @media(max-width:900px){
    .adburger{display:inline-flex;}
    .ad{--barh:54px;}
    .navclose{display:flex;align-items:center;justify-content:flex-end;background:none;border:none;cursor:pointer;padding:4px 12px 10px;margin-bottom:4px;border-bottom:1px solid var(--border-soft);}
    .opsbar{padding:0 13px;gap:10px;overflow:hidden;min-width:0;}
    .adbrand{font-size:13.5px;min-width:0;flex-shrink:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
    .roleswitch{font-size:0;gap:0;flex-shrink:1;min-width:0;}
    .rolebtn{max-width:132px;min-width:0;}
    .rolebtn .rl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hide-sm{display:none!important;}
    .adnav{position:fixed;top:0;left:0;bottom:0;width:230px;z-index:120;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,0,0,1);box-shadow:var(--shadow-lg);padding-top:14px;}
    .adnav.open{transform:translateX(0);}
    .adnav-scrim{display:block;position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;}
    .adnav-scrim.show{opacity:1;pointer-events:auto;}
    .adcontent{padding:18px 14px 60px;}
    .band{grid-template-columns:repeat(2,1fr)!important;gap:10px;}
    .grid2{grid-template-columns:1fr!important;}
    .trustbadges{grid-template-columns:1fr!important;}
    .pghead h1{font-size:20px;}
    .pghead{flex-direction:column;align-items:flex-start;}
    .ctrls{flex-wrap:wrap;}
    table.adtbl{display:block;overflow-x:auto;white-space:nowrap;}
  }
  @media(max-width:480px){
    .band{grid-template-columns:1fr!important;}
    .envbadge{display:none;}
  }
</style>
</head>
<body>
<div class="ad" id="ad"></div>

<script>
const A = (function(){
  const P={
    overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4a3 3 0 0 1 0 6m5 10a6 6 0 0 0-5-5.9"/>',
    usage:'<path d="M3 12h4l3 8 4-16 3 8h4"/>',
    tvl:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.2"/>',
    revenue:'<path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v6h-6"/>',
    system:'<path d="M12 2l8 4v6c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6l8-4Z"/>',
    stake:'<path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="9" width="3" height="8"/>',
    cfg:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 2h-5l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5L3.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h5l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1Z"/>',
    audit:'<path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
    check:'<path d="M5 13l4 4L19 7"/>',
    ext:'<path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>',
    refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5"/>',
    lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    door:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14l5-5-5-5m5 5H9"/>',
    pause:'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
  };
  function ic(n,s=17,w=2){return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;}
  // stream color contract
  const STREAM={swap:'#4D83FF',premium:'#38C6F4',perf:'#9B6CEB',mgmt:'#C45FD6',srk:'#F5B62E',treasury:'#8A97A8'};
  function money(n){return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0});}
  function abbr(n){return n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':'$'+n.toFixed(0);}
  return {P,ic,STREAM,money,abbr};
})();
const ic=A.ic, STREAM=A.STREAM, abbr=A.abbr, money=A.money;

/* ---------- chart helpers (hand-built SVG, token-styled) ---------- */
function axisY(max,W,H,pad){ // returns gridline svg + scale fn
  const lines=4; let g='';
  for(let i=0;i<=lines;i++){const y=pad.t+(H-pad.t-pad.b)*(i/lines); const val=max*(1-i/lines);
    g+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-opacity=".5" stroke-width="1"/>`;
    g+=`<text x="${pad.l-7}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted-foreground)">${abbr(val)}</text>`;}
  return g;
}
function stackedBars(data, keys, max, opts={}){
  const W=opts.W||560,H=opts.H||220,pad={l:42,r:14,t:12,b:24};
  const n=data.length, bw=(W-pad.l-pad.r)/n*0.62, gap=(W-pad.l-pad.r)/n;
  let s=axisY(max,W,H,pad);
  data.forEach((d,i)=>{
    const x=pad.l+gap*i+(gap-bw)/2; let yAcc=H-pad.b;
    keys.forEach(k=>{
      const v=d[k]||0; if(v<=0)return; const h=(v/max)*(H-pad.t-pad.b);
      const col=(opts.colors&&opts.colors[k])||STREAM[k]||'var(--muted-foreground)';
      const proj=k==='mgmt'||k==='srk';
      s+=`<rect x="${x.toFixed(1)}" y="${(yAcc-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" ${proj?'fill-opacity=".35" stroke="'+col+'" stroke-dasharray="3 2"':''} rx="1.5"/>`;
      yAcc-=h;
    });
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="9" fill="var(--muted-foreground)">${d.x}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${s}</svg>`;
}
function linePath(vals,max,W,H,pad){
  return vals.map((v,i)=>{const x=pad.l+(W-pad.l-pad.r)*(i/(vals.length-1));const y=pad.t+(H-pad.t-pad.b)*(1-v/max);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');
}
function trajectory(real, fore, max, opts={}){
  const W=opts.W||560,H=opts.H||220,pad={l:42,r:14,t:12,b:24};
  let s=axisY(max,W,H,pad);
  const all=real.concat(fore.slice(1));
  const todayX=pad.l+(W-pad.l-pad.r)*((real.length-1)/(all.length-1));
  s+=`<line x1="${todayX.toFixed(1)}" y1="${pad.t}" x2="${todayX.toFixed(1)}" y2="${H-pad.b}" stroke="var(--muted-foreground)" stroke-dasharray="2 3" stroke-opacity=".6"/>`;
  s+=`<text x="${todayX.toFixed(1)}" y="${pad.t-2}" text-anchor="middle" font-size="9" fill="var(--muted-foreground)">today</text>`;
  // realized solid
  const realPts=real.map((v,i)=>[pad.l+(W-pad.l-pad.r)*(i/(all.length-1)),pad.t+(H-pad.t-pad.b)*(1-v/max)]);
  const forePts=fore.map((v,i)=>[pad.l+(W-pad.l-pad.r)*((real.length-1+i)/(all.length-1)),pad.t+(H-pad.t-pad.b)*(1-v/max)]);
  s+=`<path d="${realPts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${STREAM.swap}" stroke-width="2.4"/>`;
  s+=`<path d="${forePts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${STREAM.swap}" stroke-width="2.4" stroke-dasharray="5 4" stroke-opacity=".7"/>`;
  s+=`<circle cx="${realPts[realPts.length-1][0].toFixed(1)}" cy="${realPts[realPts.length-1][1].toFixed(1)}" r="3.5" fill="${STREAM.swap}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${s}</svg>`;
}
function dualArea(yieldV, revV, max, opts={}){
  const W=opts.W||560,H=opts.H||200,pad={l:42,r:14,t:12,b:24};
  let s=axisY(max,W,H,pad);
  function area(vals,color,op){const pts=vals.map((v,i)=>[pad.l+(W-pad.l-pad.r)*(i/(vals.length-1)),pad.t+(H-pad.t-pad.b)*(1-v/max)]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    return `<path d="${line} L${(W-pad.r).toFixed(1)} ${H-pad.b} L${pad.l} ${H-pad.b} Z" fill="${color}" fill-opacity="${op}"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>`;}
  s+=area(yieldV,STREAM.premium,.16);
  s+=area(revV,'var(--muted-foreground)',.12);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${s}</svg>`;
}
function divergeBars(dep, wd, opts={}){
  const W=opts.W||560,H=opts.H||220,pad={l:42,r:14,t:12,b:28};
  const max=Math.max(...dep,...wd.map(Math.abs))*1.1;
  const mid=pad.t+(H-pad.t-pad.b)/2;
  const n=dep.length,gap=(W-pad.l-pad.r)/n,bw=gap*0.5;
  let s=`<line x1="${pad.l}" y1="${mid}" x2="${W-pad.r}" y2="${mid}" stroke="var(--border)"/>`;
  let net=0; const netPts=[];
  for(let i=0;i<n;i++){
    const x=pad.l+gap*i+(gap-bw)/2;
    const dh=(dep[i]/max)*(H-pad.t-pad.b)/2; const wh=(Math.abs(wd[i])/max)*(H-pad.t-pad.b)/2;
    s+=`<rect x="${x.toFixed(1)}" y="${(mid-dh).toFixed(1)}" width="${bw.toFixed(1)}" height="${dh.toFixed(1)}" fill="var(--gain)" rx="1"/>`;
    s+=`<rect x="${x.toFixed(1)}" y="${mid.toFixed(1)}" width="${bw.toFixed(1)}" height="${wh.toFixed(1)}" fill="var(--loss)" rx="1"/>`;
    net+=dep[i]+wd[i]; netPts.push([x+bw/2, net]);
  }
  const nmax=Math.max(...netPts.map(p=>Math.abs(p[1])))*1.2||1;
  const npath=netPts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+(mid-(p[1]/nmax)*(H-pad.t-pad.b)/2).toFixed(1)).join(' ');
  s+=`<path d="${npath}" fill="none" stroke="${STREAM.swap}" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${s}</svg>`;
}
function composed(areaV, lineV, amax, lmax, opts={}){
  const W=opts.W||560,H=opts.H||220,pad={l:42,r:38,t:12,b:24};
  let s=axisY(amax,W,H,pad);
  const apts=areaV.map((v,i)=>[pad.l+(W-pad.l-pad.r)*(i/(areaV.length-1)),pad.t+(H-pad.t-pad.b)*(1-v/amax)]);
  const aline=apts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  s+=`<path d="${aline} L${(W-pad.r).toFixed(1)} ${H-pad.b} L${pad.l} ${H-pad.b} Z" fill="${STREAM.swap}" fill-opacity=".12"/><path d="${aline}" fill="none" stroke="${STREAM.swap}" stroke-width="2"/>`;
  const lpts=lineV.map((v,i)=>[pad.l+(W-pad.l-pad.r)*(i/(lineV.length-1)),pad.t+(H-pad.t-pad.b)*(1-v/lmax)]);
  s+=`<path d="${lpts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${STREAM.srk}" stroke-width="2.2" stroke-dasharray="0"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${s}</svg>`;
}
function sparkline(vals,color,W=120,H=34){
  const min=Math.min(...vals),max=Math.max(...vals),r=(max-min)||1;
  const p=vals.map((v,i)=>[(i/(vals.length-1))*W,H-((v-min)/r)*(H-4)-2]);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><path d="${p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="1.8"/></svg>`;
}

/* Belt-and-suspenders against the "top bar paints, then a later repaint inside the
   Showcase's clipped/scaled iframe drops it" compositing glitch. The bar is logically
   present (correct computed styles) but its region goes stale and stops painting. A
   momentary, invisible opacity toggle forces that region to recomposite — no transform,
   no sticky, no layout change, no visible flicker. Fire it across the first few seconds
   (rAF, fonts.ready, window load, and timed nudges) to cover the ~1s vanish window. */
function repaintTopbar(){
  const b=document.querySelector('.opsbar'); if(!b) return;
  b.style.opacity='0.999';
  requestAnimationFrame(()=>{ b.style.opacity=''; });
}
requestAnimationFrame(repaintTopbar);
[120,400,900,1600,2600].forEach(t=>setTimeout(repaintTopbar,t));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(repaintTopbar);
window.addEventListener('load',repaintTopbar);

window.A={
  goKill(){screen='killswitch';render();},
  openKillConfirm(){
    const paused=window.__paused||false;
    const ov=document.createElement('div'); ov.className='addialog-scrim show';
    ov.innerHTML=`<div class="addialog">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="pill ${paused?'ok':'amber'}" style="font-size:11px"><span class="led"></span>${paused?'Resume':'Emergency pause'}</span></div>
      <h3 style="font-size:17px;font-weight:600;margin:6px 0 8px">${paused?'Propose resuming operation?':'Propose an emergency pause?'}</h3>
      <p style="font-size:13px;color:var(--muted-foreground);line-height:1.55;margin:0 0 14px">${paused?'This proposes lifting the pause. New deposits and agent execution resume once <b style="color:var(--foreground)">2 of 3</b> signers confirm on-chain.':'This proposes halting <b style="color:var(--foreground)">new deposits and agent execution</b>. It needs <b style="color:var(--foreground)">2 of 3</b> multisig signers to take effect. <b style="color:var(--gain)">User withdrawals stay open the entire time.</b>'}</p>
      <div style="background:var(--background);border:1px solid var(--border-soft);border-radius:10px;padding:12px;margin-bottom:14px">
        <div class="statusrow" style="padding:7px 0"><span class="muted">Your role</span><span style="font-weight:600">${ROLES[role].label} · signer 1 of 2 needed</span></div>
        <div class="statusrow" style="padding:7px 0;border-bottom:none"><span class="muted">Affects withdrawals?</span><span style="color:var(--gain);font-weight:600">No — never</span></div></div>
      <label style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--foreground);margin-bottom:16px;cursor:pointer"><input type="checkbox" id="killAck" style="margin-top:2px"/> I understand this ${paused?'resume':'pause'} only takes effect after the multisig threshold is met, and that it cannot move user funds or block withdrawals.</label>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn-exp" id="killCancel">Cancel</button>
        <button class="btn-exp" id="killGo" disabled style="opacity:.5;border-color:color-mix(in srgb,var(--caution) 45%,transparent);color:var(--caution)">${ic('pause',13)} Sign &amp; propose</button></div>
    </div>`;
    document.body.appendChild(ov);
    const ack=ov.querySelector('#killAck'), go=ov.querySelector('#killGo');
    ack.onchange=()=>{go.disabled=!ack.checked;go.style.opacity=ack.checked?'1':'.5';};
    ov.querySelector('#killCancel').onclick=()=>ov.remove();
    ov.onclick=e=>{if(e.target===ov)ov.remove();};
    go.onclick=()=>{ go.innerHTML='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor"></span> Awaiting multisig (1/2)…'; go.disabled=true;
      setTimeout(()=>{ window.__paused=!paused; ov.remove(); screen='killswitch'; render(); },1400); };
  }
};
