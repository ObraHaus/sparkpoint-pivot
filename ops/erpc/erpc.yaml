# eRPC config — feature 039 (specs/039-erpc-rpc-proxy).
#
# INVARIANTS (contracts/proxy-endpoints.md — re-check on EVERY edit of this file):
#   1. The five AA methods are ignoreMethods on every upstream except Alchemy (bundler pin).
#   2. eth_getLogs is ignoreMethods on Alchemy (free tier caps ranges at 10 blocks);
#      the serving upstream has auto-split on.
#   3. Cache: ONLY `finality: finalized` policies may exist under feature 039 (Stage A).
#      Mutable-data ("realtime"/"unfinalized") caching is a SEPARATE future feature.
#   4. Budgets: Alchemy hard-capped at 15 req/s (free tier ≈ 19 eth_call/s ceiling);
#      the browser lane carries its own budget.
#   5. `app` CORS allowlist contains platform origins only.
#   6. Secrets/keys arrive via env interpolation — never a literal in this file.
#   7. The image tag is pinned in compose.yaml — never `latest`.
#
# Field shapes follow the eRPC docs as of Aug 2026; the container validates config on
# boot, so the Stage-0 deploy (tasks T004/T005) is the schema check. If a field is
# rejected, fix it HERE (the config is IaC) — never by hand-editing the container.

logLevel: info

server:
  httpPort: 4000

metrics:
  enabled: true
  port: 4001          # LAN-only (not exposed via the public proxy) — scraped by the
                      # admin route and Uptime Kuma; it leaks upstream URLs otherwise.

database:
  evmJsonRpcCache:
    connectors:
      - id: mem
        driver: memory
        memory:
          maxItems: 200000
          maxTotalSize: "512MB"
    policies:
      # ---- Stage A: provably-immutable only. Finalized chain data never changes —
      # never pay for it twice. NOTHING mutable may be cached under 039 (invariant 3).
      - network: "*"
        method: "eth_chainId"
        finality: finalized
        ttl: 0
        connector: mem
      - network: "*"
        method: "eth_getLogs"
        finality: finalized
        ttl: 0
        connector: mem
      - network: "*"
        method: "eth_getBlockByNumber"
        finality: finalized
        ttl: 0
        connector: mem
      - network: "*"
        method: "eth_getBlockByHash"
        finality: finalized
        ttl: 0
        connector: mem
      - network: "*"
        method: "eth_getTransactionReceipt"
        finality: finalized
        ttl: 0
        connector: mem
      - network: "*"
        method: "eth_getTransactionByHash"
        finality: finalized
        ttl: 0
        connector: mem

rateLimiters:
  budgets:
    - id: alchemy-free          # keep the paid provider inside its free tier: hard cap,
      rules:                    # auto-tune on the upstream backs off further on errors.
        - method: "*"
          maxCount: 15
          period: 1s
    - id: app-public            # the browser lane's own ceiling — third-party abuse of
      rules:                    # the public endpoint can never drain the Alchemy budget.
        - method: "*"
          maxCount: 100
          period: 1s

# The five ERC-4337 methods only Alchemy (the bundler) can serve. Referenced via YAML
# anchor from every non-Alchemy upstream (invariant 1).
x-aa-methods: &aa-methods
  - eth_sendUserOperation
  - eth_estimateUserOperationGas
  - eth_getUserOperationReceipt
  - eth_getUserOperationByHash
  - eth_supportedEntryPoints

# Upstream definitions, shared by both projects via anchors.
x-upstreams:
  alchemy-base-sepolia: &up-alchemy-84532
    id: alchemy-base-sepolia
    endpoint: "${BASE_SEPOLIA_ALCHEMY_URL}"     # full keyed URL, service env only
    evm:
      chainId: 84532
    rateLimitBudget: alchemy-free
    rateLimitAutoTune:
      enabled: true
      errorRateThreshold: 0.1
    ignoreMethods:
      - eth_getLogs                             # invariant 2: 10-block cap — don't even try
  base-sepolia-public: &up-public-84532
    id: base-sepolia-public
    endpoint: "https://sepolia.base.org"
    evm:
      chainId: 84532
    routing:
      scoreMultipliers:
        - overall: 0.5                          # prefer Alchemy except where excluded
    ignoreMethods: *aa-methods                  # invariant 1: AA lives on the bundler only
  publicnode-eth: &up-publicnode-1
    id: publicnode-eth
    endpoint: "https://ethereum-rpc.publicnode.com"
    evm:
      chainId: 1                                # SRK-gate reads: /core/evm/1
  robinhood-public: &up-robinhood-46630
    id: robinhood-public
    endpoint: "https://rpc.testnet.chain.robinhood.com"
    evm:
      chainId: 46630                            # no paid provider exists — but now cached + retried

projects:
  # ---------- core: agent + web server + indexers (LAN, secret-authed) ----------
  - id: core
    auth:
      strategies:
        - type: secret
          secret:
            value: "${ERPC_CORE_SECRET}"
    networkDefaults:
      evm:
        integrity:
          ethGetLogsSplitOnError: true          # invariant 2: arbitrary ranges, no window tuning
      failsafe:
        timeout:
          duration: 15s
        retry:
          maxAttempts: 3
          backoffFactor: 1.5
        hedge:                                  # reads only — eRPC never hedges writes
          quantile: 0.8
          minDelay: 150ms
          maxDelay: 2s
    upstreams:
      - *up-alchemy-84532
      - *up-public-84532
      - *up-publicnode-1
      - *up-robinhood-46630

  # ---------- app: browsers (public HTTPS, CORS-fenced, no secret) ----------
  - id: app
    cors:
      allowedOrigins:
        - "https://alpha.sparkpoint.io"
        - "https://*.aldrickb.app"
    rateLimitBudget: app-public
    networkDefaults:
      evm:
        integrity:
          ethGetLogsSplitOnError: true
      failsafe:
        timeout:
          duration: 15s
        retry:
          maxAttempts: 3
          backoffFactor: 1.5
        hedge:
          quantile: 0.8
          minDelay: 150ms
          maxDelay: 2s
    upstreams:                                  # browsers only ever need 84532 —
      - *up-alchemy-84532                       # no mainnet, no Robinhood, no AA reachability
      - *up-public-84532
