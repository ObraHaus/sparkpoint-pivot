# sparkpoint-erpc — Coolify service (feature 042, specs/042-erpc-rpc-proxy).
#
# Deploy (operator-confirmed, tasks T004): create a Coolify docker-compose service from
# this file on the same host as the agent + web apps, set the env below in the Coolify
# service env, and attach the public FQDN for the `app` lane to port 4000.
#
# ERPC_IMAGE_TAG is REQUIRED and must be a specific release (check
# https://github.com/erpc/erpc/releases at deploy time) — an SPOF for every chain read
# does not get surprise upgrades, so `latest` is deliberately impossible here.

services:
  erpc:
    image: "ghcr.io/erpc/erpc:${ERPC_IMAGE_TAG:?pin-a-release-tag--never-latest}"
    restart: unless-stopped
    volumes:
      - ./erpc.yaml:/erpc.yaml:ro
    ports:
      - "4000:4000"        # JSON-RPC — LAN + (via Coolify's proxy) the public `app` FQDN
      - "4001:4001"        # Prometheus metrics — LAN ONLY; never attach a public domain
    environment:
      # Go GC headroom: ~90% of the container limit, or the OOM killer finds it first.
      GOMEMLIMIT: "900MiB"
      # Provider key + core-lane secret come from the Coolify service env (never committed):
      BASE_SEPOLIA_ALCHEMY_URL: "${BASE_SEPOLIA_ALCHEMY_URL}"
      ERPC_CORE_SECRET: "${ERPC_CORE_SECRET}"
    deploy:
      resources:
        limits:
          # THE self-heal, and it is not optional. GOMEMLIMIT above is a SOFT Go limit: without a
          # hard cap nothing ever OOM-kills a bloated heap, so instead of exiting (and being
          # restarted in seconds by `restart:` above) the process GC-thrashes and stalls for ~an
          # hour. That is exactly what happened when the deployed Coolify service was missing this
          # block — 16% downtime over 8 days, ~38 incidents, every one a 504 that healed itself.
          memory: 1g
    # NO healthcheck — deliberately, and do not "restore" one.
    #
    # `ghcr.io/erpc/erpc` is DISTROLESS: `docker inspect` shows entrypoint /erpc-server and user
    # 65532, with no sh, wget, curl or busybox in the image. Both healthcheck forms need something
    # to exec — CMD-SHELL needs /bin/sh, CMD needs a binary — so any probe written here can only
    # fail, pinning the service to permanently-unhealthy and teaching everyone to ignore the status.
    # (This file used to carry a `CMD-SHELL` wget probe that could never have passed.)
    #
    # It would not buy recovery either way: plain Compose does not restart an unhealthy container
    # (only Swarm does). Liveness is asserted from OUTSIDE instead — Uptime Kuma on spark-mon polls
    # the no-secret `app` lane with a real `eth_blockNumber` (NOT eth_chainId, which answers from the
    # permanent cache and lies during the ~60s post-restart cold start).
